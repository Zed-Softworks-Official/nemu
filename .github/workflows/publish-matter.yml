name: Publish nemu-matter

on:
  push:
    tags:
      - "matter-v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/zed-softworks-official/nemu-matter

jobs:
  # Gate: same Environment approval as nemu-core releases.
  build:
    environment: core-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-8vcpu-ubuntu-2204
            platform: linux/amd64
            arch: amd64
            cache_key: apps/matter/Dockerfile-amd64
          - runner: blacksmith-8vcpu-ubuntu-2204-arm
            platform: linux/arm64
            arch: arm64
            cache_key: apps/matter/Dockerfile-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: ${{ matrix.cache_key }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./apps/matter
          file: apps/matter/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}

  merge-manifests:
    needs: build
    runs-on: blacksmith
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:latest"
