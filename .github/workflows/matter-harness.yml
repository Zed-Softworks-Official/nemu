# Seam 1 of the Matter adapter (NEM-109): commissions simulated matter.js
# Devices through the adapter under test, over MQTT only, and compares what it
# publishes with the golden payloads recorded from the Rust adapter.
#
# Mosquitto runs in Docker. The simulated Devices and the adapter share the
# runner's network, so mDNS discovery works as on a Controller host.
#
# The matter.js adapter replaces the Rust one ticket by ticket. Its job runs
# only the steps it supports so far (MATTER_HARNESS_STEPS) and leaves out the
# topics later tickets add (MATTER_HARNESS_IGNORE_TOPICS). Each ticket widens
# that scope. Steps that must run for later ones but can't match yet are run
# without being compared (MATTER_HARNESS_UNCHECKED_STEPS). The Rust job runs the
# whole scenario and compares all of it except the deliberate fixes the golden
# records over the Rust adapter.

name: Matter harness

on:
  pull_request:
    paths:
      - platform/matter/**
      - platform/matter-adapter/**
      - packages/protocol/**
      - platform/matter-harness/**
      - .github/workflows/matter-harness.yml
  push:
    paths:
      - platform/matter/**
      - platform/matter-adapter/**
      - packages/protocol/**
      - platform/matter-harness/**
      - .github/workflows/matter-harness.yml
  workflow_dispatch:

concurrency:
  group: matter-harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0

      - name: Install the BLE build dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Build the Rust adapter
        run: cargo build --release --locked --manifest-path platform/matter/Cargo.toml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install the harness
        run: pnpm install --frozen-lockfile --filter @nemu/matter-harness...

      - name: Type-check and unit-test the harness
        run: |
          pnpm --filter @nemu/matter-harness check-types
          pnpm --filter @nemu/matter-harness test

      - name: Pull Mosquitto
        run: docker pull eclipse-mosquitto:2.0.22

      - name: Compare the Rust adapter with the golden payloads
        env:
          TMPDIR: ${{ runner.temp }}/matter-harness
          # NEM-119: the golden has the plug publish offline, which the Rust
          # adapter never does.
          MATTER_HARNESS_UNCHECKED_STEPS: plug-goes-offline
        run: |
          mkdir -p "$TMPDIR"
          pnpm --filter @nemu/matter-harness harness

      - name: Upload the run on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matter-harness-rust-run
          path: |
            platform/matter-harness/.run/
            ${{ runner.temp }}/matter-harness/
          include-hidden-files: true
          if-no-files-found: ignore

  matterjs-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install the adapter and the harness
        run: pnpm install --frozen-lockfile --filter @nemu/matter-adapter... --filter @nemu/matter-harness...

      - name: Type-check and unit-test the adapter
        run: |
          pnpm --filter @nemu/matter-adapter check-types
          pnpm --filter @nemu/matter-adapter test

      - name: Build the adapter
        run: pnpm --filter @nemu/matter-adapter build

      - name: Pull Mosquitto
        run: docker pull eclipse-mosquitto:2.0.22

      - name: Compare the matter.js adapter with the golden payloads
        env:
          TMPDIR: ${{ runner.temp }}/matter-harness
          MATTER_HARNESS_ADAPTER_CMD: node ${{ github.workspace }}/platform/matter-adapter/dist/main.js
          # NEM-115: commission, on/off and health check. NEM-116: light brightness, color temp.
          # NEM-118: Capabilities, observations and assigned Capability IDs.
          # NEM-120: commission-cancel. NEM-119: rename, offline and recovery, remove, restart.
          # NEM-117: strips.
          MATTER_HARNESS_STEPS: adapter-starts,commission-plug,assign-plug-capability-ids,plug-on,plug-off,plug-load-changes,commission-light,light-on,light-brightness,light-brightness-below-minimum,light-brightness-above-maximum,light-color-temperature,light-color-temperature-above-maximum,light-off,rename-light,plug-goes-offline,plug-comes-back,health-check,commission-without-code,commission-cancel,remove-light,adapter-restarts,commission-strip,strip-outlet-2-on,strip-outlet-1-on,strip-all-off
          # adapter-restarts: the golden records the Rust boot re-read, a fresh reading with the
          # assigned Capability IDs lost (Rust kept them in memory). matter.js keeps them
          # (NEM-118) and does not re-stamp an unchanged stored reading. Everything else in
          # the step matches; harness:lifecycle below checks the restart itself.
          MATTER_HARNESS_UNCHECKED_STEPS: adapter-restarts
        run: |
          mkdir -p "$TMPDIR"
          pnpm --filter @nemu/matter-harness harness

      - name: Restart, restore and remove with the matter.js adapter
        env:
          TMPDIR: ${{ runner.temp }}/matter-harness
          MATTER_HARNESS_ADAPTER_CMD: node ${{ github.workspace }}/platform/matter-adapter/dist/main.js
        run: |
          mkdir -p "$TMPDIR"
          pnpm --filter @nemu/matter-harness harness:lifecycle

      - name: Upload the run on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matter-harness-matterjs-run
          path: |
            platform/matter-harness/.run/
            ${{ runner.temp }}/matter-harness/
          include-hidden-files: true
          if-no-files-found: ignore
