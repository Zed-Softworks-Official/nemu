# Seam 1 of the Matter adapter (NEM-109): commissions simulated matter.js
# Devices through the matter.js adapter, over MQTT only, and compares what it
# publishes with the golden payloads.
#
# Mosquitto runs in Docker. The simulated Devices and the adapter share the
# runner's network, so mDNS discovery works as on a Controller host.
#
# The golden file was recorded from the Rust adapter before NEM-121 deleted it,
# and is the frozen reference for the MQTT contract. It differs from the Rust
# recording only in the deliberate fixes NEM-119 and NEM-121 made over Rust
# (offline availability, Capability IDs kept across a restart). The job runs the
# whole scenario and compares every step.

name: Matter harness

on:
  pull_request:
    paths:
      - platform/matter-adapter/**
      - packages/protocol/**
      - platform/matter-harness/**
      - scripts/platform-paths*.sh
      - scripts/release-*.sh
      - .github/workflows/matter-harness.yml
  push:
    paths:
      - platform/matter-adapter/**
      - packages/protocol/**
      - platform/matter-harness/**
      - scripts/platform-paths*.sh
      - scripts/release-*.sh
      - .github/workflows/matter-harness.yml
  workflow_dispatch:

concurrency:
  group: matter-harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matterjs-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install the adapter and the harness
        run: pnpm install --frozen-lockfile --filter @nemu/matter-adapter... --filter @nemu/matter-harness...

      - name: Type-check and unit-test the adapter
        run: |
          pnpm --filter @nemu/matter-adapter check-types
          pnpm --filter @nemu/matter-adapter test

      - name: Type-check and unit-test the harness
        run: |
          pnpm --filter @nemu/matter-harness check-types
          pnpm --filter @nemu/matter-harness test

      - name: Build the adapter
        run: pnpm --filter @nemu/matter-adapter build

      - name: Pull Mosquitto
        run: docker pull eclipse-mosquitto:2.0.22

      - name: Compare the matter.js adapter with the golden payloads
        env:
          TMPDIR: ${{ runner.temp }}/matter-harness
          MATTER_HARNESS_ADAPTER_CMD: node ${{ github.workspace }}/platform/matter-adapter/dist/main.js
        run: |
          mkdir -p "$TMPDIR"
          pnpm --filter @nemu/matter-harness harness

      - name: Restart, restore and remove with the matter.js adapter
        env:
          TMPDIR: ${{ runner.temp }}/matter-harness
          MATTER_HARNESS_ADAPTER_CMD: node ${{ github.workspace }}/platform/matter-adapter/dist/main.js
        run: |
          mkdir -p "$TMPDIR"
          pnpm --filter @nemu/matter-harness harness:lifecycle

      - name: Check the release trigger covers what the image copies
        run: bash scripts/platform-paths.test.sh

      - name: Build the nemu-matter image
        run: docker build --file platform/matter-adapter/Dockerfile --tag nemu-matter:ci .

      - name: Upload the run on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matter-harness-matterjs-run
          path: |
            platform/matter-harness/.run/
            ${{ runner.temp }}/matter-harness/
          include-hidden-files: true
          if-no-files-found: ignore
