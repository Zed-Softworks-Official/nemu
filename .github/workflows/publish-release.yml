# Publishes one platform Release.
#
# A push to canary cuts the next patch when platform/ or infra/prod/ changed
# since the newest v0.* tag (or since the previous canary tip when no tag
# exists yet). It builds the Nemu images, freezes every service image at a
# digest, signs the Canary manifest, tags those Nemu images with the Platform
# version and :canary, and tags the commit v0.MINOR.PATCH. A dashboard-only
# push skips the publish. A minor bump is an explicit input: the
# workflow_dispatch checkbox, or a commit message line
# `Bump-Platform-Minor: true`. It is not the default. The first Platform
# version is 0.1.0.
#
# An explicit Publish Release run ignores the platform-hash skip. On canary it
# cuts a patch even when the trees match (for example a third-party digest
# refresh). On master with channel stable it points the Stable manifest at a
# Platform version already cut and moves :latest. When master is only ahead by
# non-platform commits, Stable reuses the newest matching cut and does not
# allocate or open a sync PR. A master commit whose platform tree has never
# been published is cut as the next Platform version and opens a sync PR into
# canary.
#
# Third-party images are digest-pinned and are not tagged. Homes install the
# signed manifest. :canary and :latest are not a Release.
#
# The private release-signing key is the NEMU_RELEASE_SIGNING_KEY secret
# (base64 of the 32-byte ed25519 seed). This workflow does not print it and
# does not upload installed-version or channel telemetry.

name: Publish Release

on:
  push:
    branches:
      - canary
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to publish
        required: true
        type: choice
        options:
          - canary
          - stable
        default: canary
      minor_bump:
        description: When cutting a new Platform version, allocate the next minor instead of the next patch
        required: true
        type: boolean
        default: false

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CORE_IMAGE: ghcr.io/zed-softworks-official/nemu-core
  MATTER_IMAGE: ghcr.io/zed-softworks-official/nemu-matter

jobs:
  prepare:
    runs-on: blacksmith
    outputs:
      source: ${{ steps.vars.outputs.source }}
      minor_bump: ${{ steps.vars.outputs.minor_bump }}
      already_cut: ${{ steps.vars.outputs.already_cut }}
      should_build: ${{ steps.vars.outputs.should_build }}
      should_publish: ${{ steps.vars.outputs.should_publish }}
      plan_commit: ${{ steps.vars.outputs.plan_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Choose the publish
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_MINOR: ${{ inputs.minor_bump }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          source="canary"
          minor="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            source="$INPUT_CHANNEL"
            minor="$INPUT_MINOR"
          fi
          if git log -1 --format='%B' | grep -Eq '^Bump-Platform-Minor: true$'; then
            minor="true"
          fi
          if [ "$source" = "stable" ] && [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "An explicit Stable release publishes master." >&2
            exit 1
          fi
          if [ "$source" = "canary" ] && [ "$GITHUB_REF" != "refs/heads/canary" ]; then
            echo "A Canary publish runs on the canary branch." >&2
            exit 1
          fi
          git -c "http.extraheader=AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch origin --tags --force

          already="false"
          if git tag --points-at HEAD | grep -Eq '^v0\.[0-9]+\.[0-9]+$'; then
            already="true"
          fi

          # Trees a Home installs. Dashboard and Convex changes do not move this.
          platform_changed="true"
          newest=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if [[ "$tag" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
              newest="$tag"
              break
            fi
          done < <(git tag -l 'v0.*' --sort=-v:refname)

          if [ -n "$newest" ]; then
            if git diff --quiet "$newest" HEAD -- platform infra/prod; then
              platform_changed="false"
            fi
          elif [ "$EVENT_NAME" = "push" ] \
            && [ -n "${PUSH_BEFORE:-}" ] \
            && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git rev-parse --verify "$PUSH_BEFORE^{commit}" >/dev/null 2>&1; then
            if git diff --quiet "$PUSH_BEFORE" HEAD -- platform infra/prod; then
              platform_changed="false"
            fi
          fi

          plan_commit="$GITHUB_SHA"
          should_build="false"
          should_publish="false"

          if [ "$already" = "true" ]; then
            should_publish="true"
          elif [ "$platform_changed" = "false" ] && [ "$source" = "stable" ] && [ -n "$newest" ]; then
            # Master is ahead only by non-platform commits. Point Stable at the
            # newest cut whose platform tree matches and do not allocate.
            plan_commit=$(git rev-parse "${newest}^{commit}")
            should_publish="true"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$platform_changed" = "true" ]; then
            should_build="true"
            should_publish="true"
          fi

          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "minor_bump=$minor" >> "$GITHUB_OUTPUT"
          echo "already_cut=$already" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "plan_commit=$plan_commit" >> "$GITHUB_OUTPUT"
          echo "platform_changed=$platform_changed newest=${newest:-none} should_build=$should_build should_publish=$should_publish plan_commit=$plan_commit"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-8vcpu-ubuntu-2204
            platform: linux/amd64
            arch: amd64
          - runner: blacksmith-8vcpu-ubuntu-2204-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: publish-release-${{ matrix.arch }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build nemu-core
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: platform/core/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.CORE_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}

      - name: Build nemu-matter
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./platform/matter
          file: platform/matter/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.MATTER_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Build the Updater binary
        working-directory: platform/updater
        run: cargo build --release --locked --bin updater

      - name: Upload the Updater binary
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.arch }}
          path: platform/updater/target/release/updater
          if-no-files-found: error

  merge-images:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    permissions:
      packages: write
    runs-on: blacksmith
    outputs:
      core_digest: ${{ steps.digest.outputs.core }}
      matter_digest: ${{ steps.digest.outputs.matter }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch image manifests
        id: digest
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${CORE_IMAGE}:${SHA}" \
            "${CORE_IMAGE}:${SHA}-amd64" \
            "${CORE_IMAGE}:${SHA}-arm64"
          docker buildx imagetools create \
            -t "${MATTER_IMAGE}:${SHA}" \
            "${MATTER_IMAGE}:${SHA}-amd64" \
            "${MATTER_IMAGE}:${SHA}-arm64"
          core=$(docker buildx imagetools inspect "${CORE_IMAGE}:${SHA}" | awk '/^Digest:/ { print $2; exit }')
          matter=$(docker buildx imagetools inspect "${MATTER_IMAGE}:${SHA}" | awk '/^Digest:/ { print $2; exit }')
          for digest in "$core" "$matter"; do
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Nemu image digest was not resolved" >&2
              exit 1
            fi
          done
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "matter=$matter" >> "$GITHUB_OUTPUT"

  publish:
    needs: [prepare, build, merge-images]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.should_publish == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.merge-images.result == 'success' || needs.merge-images.result == 'skipped')
    permissions:
      contents: write
      packages: write
      pull-requests: write
    runs-on: blacksmith
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Updater binaries
        if: needs.prepare.outputs.should_build == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater-bins

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Build publish-release
        run: cargo build --release --locked --bin publish-release --manifest-path platform/updater/Cargo.toml

      - name: Plan and publish the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.NEMU_RELEASE_SIGNING_KEY }}
          SOURCE: ${{ needs.prepare.outputs.source }}
          MINOR_BUMP: ${{ needs.prepare.outputs.minor_bump }}
          SHOULD_BUILD: ${{ needs.prepare.outputs.should_build }}
          PLAN_COMMIT: ${{ needs.prepare.outputs.plan_commit }}
          CORE_DIGEST: ${{ needs.merge-images.outputs.core_digest }}
          MATTER_DIGEST: ${{ needs.merge-images.outputs.matter_digest }}
        run: |
          set -euo pipefail
          signing_key=${RELEASE_SIGNING_KEY:-}
          unset RELEASE_SIGNING_KEY
          git fetch origin --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cuts='[]'
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if ! [[ "$tag" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            commit=$(git rev-parse "${tag}^{commit}")
            dir="$RUNNER_TEMP/cuts/$tag"
            mkdir -p "$dir"
            if ! gh release download "$tag" --pattern release-manifest.json --dir "$dir"; then
              echo "Platform version ${tag} has no signed manifest" >&2
              exit 1
            fi
            cuts=$(jq -n \
              --argjson cuts "$cuts" \
              --arg version "${tag#v}" \
              --arg commit "$commit" \
              --slurpfile signed "$dir/release-manifest.json" \
              '$cuts + [{platformVersion: $version, commit: $commit, manifest: $signed[0].manifest}]')
          done < <(git tag -l 'v0.*')

          if [ "$SHOULD_BUILD" != "true" ]; then
            this_cut=$(jq -e --arg commit "$PLAN_COMMIT" '[.[] | select(.commit == $commit)][0]' <<<"$cuts")
            amd64=$(jq -er '.manifest.updater.amd64' <<<"$this_cut")
            arm64=$(jq -er '.manifest.updater.arm64' <<<"$this_cut")
            resolved=$(jq -c '.manifest.services' <<<"$this_cut")
          else
            resolve() {
              local digest
              digest=$(docker buildx imagetools inspect "$1" | awk '/^Digest:/ { print $2; exit }')
              if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "could not freeze a digest for $1" >&2
                exit 1
              fi
              printf '%s' "$digest"
            }
            mosquitto=$(resolve eclipse-mosquitto:2)
            zigbee=$(resolve koenkk/zigbee2mqtt)
            postgres=$(resolve postgres:16-alpine)
            amd64=$(base64 -w0 updater-bins/updater-amd64/updater)
            arm64=$(base64 -w0 updater-bins/updater-arm64/updater)
            resolved=$(jq -n \
              --arg mosquitto "$mosquitto" \
              --arg zigbee "$zigbee" \
              --arg matter "$MATTER_DIGEST" \
              --arg postgres "$postgres" \
              --arg core "$CORE_DIGEST" \
              '[
                {service: "mosquitto", image: "eclipse-mosquitto:2", digest: $mosquitto},
                {service: "zigbee2mqtt", image: "koenkk/zigbee2mqtt", digest: $zigbee},
                {service: "nemu-matter", image: "ghcr.io/zed-softworks-official/nemu-matter", digest: $matter},
                {service: "postgres", image: "postgres:16-alpine", digest: $postgres},
                {service: "nemu-core", image: "ghcr.io/zed-softworks-official/nemu-core", digest: $core}
              ]')
          fi

          jq -n \
            --arg source "$SOURCE" \
            --argjson minorBump "$MINOR_BUMP" \
            --arg commit "$PLAN_COMMIT" \
            --argjson cutReleases "$cuts" \
            --argjson resolved "$resolved" \
            --rawfile compose infra/prod/docker-compose.yml \
            --rawfile mosquitto infra/prod/mosquitto/mosquitto.conf \
            --arg amd64 "$amd64" \
            --arg arm64 "$arm64" \
            '{
              source: $source,
              minorBump: $minorBump,
              commit: $commit,
              cutReleases: $cutReleases,
              resolved: $resolved,
              stackFiles: [
                {path: "docker-compose.yml", contents: $compose},
                {path: "mosquitto/mosquitto.conf", contents: $mosquitto}
              ],
              migrations: [],
              updater: {amd64: $amd64, arm64: $arm64}
            }' > "$RUNNER_TEMP/request.json"

          if [ -z "${signing_key}" ]; then
            echo "NEMU_RELEASE_SIGNING_KEY is not set" >&2
            exit 1
          fi
          NEMU_RELEASE_SIGNING_KEY="$signing_key" \
            ./platform/updater/target/release/publish-release \
            < "$RUNNER_TEMP/request.json" > "$RUNNER_TEMP/plan.json"
          unset signing_key

          jq -r '.signedManifest' "$RUNNER_TEMP/plan.json" | base64 -d > "$RUNNER_TEMP/release-manifest.json"
          jq -e '.manifest.platformVersion' "$RUNNER_TEMP/release-manifest.json" >/dev/null
          version=$(jq -r '.platformVersion' "$RUNNER_TEMP/plan.json")
          channel=$(jq -r '.channel' "$RUNNER_TEMP/plan.json")

          jq -c '.imageTags[]' "$RUNNER_TEMP/plan.json" | while IFS= read -r row; do
            image=$(jq -r '.image' <<<"$row")
            tag=$(jq -r '.tag' <<<"$row")
            digest=$(jq -r '.digest' <<<"$row")
            docker buildx imagetools create -t "${image}:${tag}" "${image}@${digest}"
          done

          git_tag=$(jq -r '.gitTag // empty' "$RUNNER_TEMP/plan.json")
          if [ -n "$git_tag" ]; then
            if git rev-parse -q --verify "refs/tags/${git_tag}" >/dev/null; then
              existing=$(git rev-parse "${git_tag}^{commit}")
              if [ "$existing" != "$PLAN_COMMIT" ]; then
                echo "${git_tag} already points at another commit" >&2
                exit 1
              fi
            fi
            # Attach the manifest before the version tag exists. A draft
            # release does not publish the tag; publishing the release does.
            if gh release view "$git_tag" >/dev/null 2>&1; then
              gh release upload "$git_tag" "$RUNNER_TEMP/release-manifest.json#release-manifest.json" --clobber
            else
              gh release create "$git_tag" \
                "$RUNNER_TEMP/release-manifest.json#release-manifest.json" \
                --draft \
                --target "$PLAN_COMMIT" \
                --title "$git_tag" \
                --notes "Platform version ${version}."
            fi
            if [ "$(gh release view "$git_tag" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit "$git_tag" --draft=false
            fi
            # Publishing the draft creates the tag. Push only when that did
            # not happen, and only after the manifest is attached.
            if git fetch --force origin "tag ${git_tag}"; then
              existing=$(git rev-parse "${git_tag}^{commit}")
              if [ "$existing" != "$PLAN_COMMIT" ]; then
                echo "${git_tag} already points at another commit" >&2
                exit 1
              fi
            else
              git tag "$git_tag" "$PLAN_COMMIT"
              git push origin "refs/tags/${git_tag}"
            fi
          fi

          cp "$RUNNER_TEMP/release-manifest.json" "$RUNNER_TEMP/${channel}.json"
          if gh release view release-manifests >/dev/null 2>&1; then
            gh release upload release-manifests "$RUNNER_TEMP/${channel}.json#${channel}.json" --clobber
          else
            gh release create release-manifests \
              "$RUNNER_TEMP/${channel}.json#${channel}.json" \
              --target "$PLAN_COMMIT" \
              --title "Release manifests" \
              --notes "Signed Canary and Stable manifests. A Home installs the manifest for its Release channel."
          fi

          # Only sync master back when this publish allocated a new version.
          # Reusing a cut for Stable leaves canary alone. Canary requires a
          # pull request (GitHub rejects listing the Actions app as a bypass
          # actor on this org), so open a PR instead of pushing the branch.
          if [ "$(jq -r '.mergeBackToCanary' "$RUNNER_TEMP/plan.json")" = "true" ]; then
            git fetch origin canary
            if ! git merge-base --is-ancestor "$PLAN_COMMIT" origin/canary; then
              branch="sync/stable-${version}-to-canary"
              git push origin "${PLAN_COMMIT}:refs/heads/${branch}"
              existing=$(gh pr list --base canary --head "$branch" --json number --jq 'length')
              if [ "$existing" = "0" ]; then
                gh pr create \
                  --base canary \
                  --head "$branch" \
                  --title "Sync Stable ${version} back to canary" \
                  --body "Stable allocated Platform version ${version} on master. Merge this into canary so the branches stay aligned."
              else
                echo "Sync PR for ${branch} already exists."
              fi
            fi
          fi
