# Publishes one platform Release.
#
# Canary publishes Release candidates, 0.MINOR.PATCH-canary.N. A push to canary
# cuts one when platform/ or infra/prod/ differs from the newest candidate or
# promoted Release; a dashboard-only push skips. An explicit run on canary
# ignores that skip, for example for a third-party digest refresh, but a commit
# carries one candidate: the run finishes an unfinished one and is refused on a
# finished one. N counts up within the next patch target. The minor_bump checkbox, or a commit message
# line `Bump-Platform-Minor: true`, starts the next minor target instead, once
# per cycle. advance_version starts the next patch target.
#
# Stable publishes plain versions, 0.MINOR.PATCH, from master. Name the exact
# candidate to promote: its unchanged build is published as the plain version,
# on Stable and, unless Canary is already newer, on Canary. Nothing is rebuilt.
# Or choose hotfix: master is built as the next plain patch, Stable only, and a
# sync PR into canary is opened, or a warning links to it when Actions may not
# open one. A Stable run that does neither is refused.
#
# The planner (platform/updater, publish-release) makes every decision. prepare
# asks it before anything is built, and publish asks it again, so a refused
# request leaves every channel and tag unchanged. To retry an interrupted
# publish, re-run it, or start it again with the same inputs on the same
# commit: it finishes the same version. A draft GitHub release is not a Release
# yet, and a retry replaces it.
#
# Third-party images are digest-pinned and are not tagged. Homes install the
# signed manifest. :canary and :latest are not a Release.
#
# The private release-signing key is the NEMU_RELEASE_SIGNING_KEY secret
# (base64 of the 32-byte ed25519 seed). This workflow does not print it and
# does not upload installed-version or channel telemetry.
#
# The signed channel manifest is written to the nemu-release-channels Vercel
# Blob store with NEMU_RELEASE_CHANNELS_BLOB_TOKEN, and get.nemu.sh serves it
# at /releases/<channel>.json. That host is not trusted: Homes verify the
# signature against the pinned key.

name: Publish Release

on:
  push:
    branches:
      - canary
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to publish
        required: true
        type: choice
        options:
          - canary
          - stable
        default: canary
      minor_bump:
        description: "Canary: target the next minor version, unless this cycle already does"
        required: true
        type: boolean
        default: false
      advance_version:
        description: "Canary: start the next patch target, so the current target can be promoted"
        required: true
        type: boolean
        default: false
      candidate:
        description: "Stable: the Release candidate to promote, for example 0.1.4-canary.3"
        required: false
        type: string
        default: ""
      hotfix:
        description: "Stable: build master as a Hotfix Release instead of promoting"
        required: true
        type: boolean
        default: false

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CORE_IMAGE: ghcr.io/zed-softworks-official/nemu-core
  MATTER_IMAGE: ghcr.io/zed-softworks-official/nemu-matter
  # What was asked for. Both jobs give these to scripts/release-facts.sh.
  SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'canary' }}
  BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || '' }}
  COMMIT: ${{ github.sha }}
  PUSH: ${{ github.event_name == 'push' }}
  # A re-run may find its own cut finished.
  RESUMING: ${{ github.run_attempt > 1 }}
  MINOR_BUMP: ${{ inputs.minor_bump || false }}
  ADVANCE_VERSION: ${{ inputs.advance_version || false }}
  CANDIDATE: ${{ inputs.candidate || '' }}
  HOTFIX: ${{ inputs.hotfix || false }}

jobs:
  prepare:
    runs-on: blacksmith
    outputs:
      action: ${{ steps.decide.outputs.action }}
      version: ${{ steps.decide.outputs.version }}
      commit: ${{ steps.decide.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0

      - name: Build publish-release
        run: cargo build --release --locked --bin publish-release --manifest-path platform/updater/Cargo.toml

      - name: Decide the publish
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./scripts/release-facts.sh "$RUNNER_TEMP/facts" > "$RUNNER_TEMP/release.json"
          ./platform/updater/target/release/publish-release decide \
            < "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/decision.json"
          jq . "$RUNNER_TEMP/decision.json"
          jq -r '"action=\(.action)", "version=\(.platformVersion)", "commit=\(.commit)"' \
            "$RUNNER_TEMP/decision.json" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.action == 'build'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-8vcpu-ubuntu-2204
            platform: linux/amd64
            arch: amd64
          - runner: blacksmith-8vcpu-ubuntu-2204-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: publish-release-${{ matrix.arch }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build nemu-core
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: platform/core/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.CORE_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}

      - name: Build nemu-matter
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./platform/matter
          file: platform/matter/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.MATTER_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0

      - name: Build the Updater binary
        working-directory: platform/updater
        run: cargo build --release --locked --bin updater

      - name: Upload the Updater binary
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.arch }}
          path: platform/updater/target/release/updater
          if-no-files-found: error

  merge-images:
    needs: [prepare, build]
    if: needs.prepare.outputs.action == 'build'
    permissions:
      packages: write
    runs-on: blacksmith
    outputs:
      core_digest: ${{ steps.digest.outputs.core }}
      matter_digest: ${{ steps.digest.outputs.matter }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch image manifests
        id: digest
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${CORE_IMAGE}:${SHA}" \
            "${CORE_IMAGE}:${SHA}-amd64" \
            "${CORE_IMAGE}:${SHA}-arm64"
          docker buildx imagetools create \
            -t "${MATTER_IMAGE}:${SHA}" \
            "${MATTER_IMAGE}:${SHA}-amd64" \
            "${MATTER_IMAGE}:${SHA}-arm64"
          # Capture the whole inspect output before parsing. Piping docker into
          # an early-exiting reader fails under pipefail, and the --format
          # template differs across buildx versions.
          digest_of() {
            local out digest
            out=$(docker buildx imagetools inspect "$1")
            digest=$(awk '/^Digest:/ { print $2; exit }' <<<"$out")
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Nemu image digest was not resolved for $1:" >&2
              printf '%s\n' "$out" | head -n 5 >&2
              exit 1
            fi
            printf '%s' "$digest"
          }
          core=$(digest_of "${CORE_IMAGE}:${SHA}")
          matter=$(digest_of "${MATTER_IMAGE}:${SHA}")
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "matter=$matter" >> "$GITHUB_OUTPUT"

  publish:
    needs: [prepare, build, merge-images]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.action != 'skip' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.merge-images.result == 'success' || needs.merge-images.result == 'skipped')
    permissions:
      contents: write
      packages: write
      pull-requests: write
    runs-on: blacksmith
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Updater binaries
        if: needs.prepare.outputs.action == 'build'
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater-bins

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0

      - name: Build publish-release
        run: cargo build --release --locked --bin publish-release --manifest-path platform/updater/Cargo.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the channel manifest publisher
        run: |
          mkdir -p "$RUNNER_TEMP/channel-publisher"
          cp scripts/publish-channel-manifest.mjs "$RUNNER_TEMP/channel-publisher/"
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/channel-publisher" @vercel/blob@2.8.2

      - name: Plan and publish the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # prepare already accepted this request.
          RESUMING: "true"
          RELEASE_SIGNING_KEY: ${{ secrets.NEMU_RELEASE_SIGNING_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.NEMU_RELEASE_CHANNELS_BLOB_TOKEN }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          CORE_DIGEST: ${{ needs.merge-images.outputs.core_digest }}
          MATTER_DIGEST: ${{ needs.merge-images.outputs.matter_digest }}
          PUBLISH_RELEASE_NOTES: ${{ vars.NEMU_PUBLISH_RELEASE_NOTES }}
        run: |
          set -euo pipefail
          signing_key=${RELEASE_SIGNING_KEY:-}
          unset RELEASE_SIGNING_KEY
          # Check before any tag moves, so a missing secret cannot leave an
          # image tag or a Release ahead of the channel manifest.
          if [ -z "${signing_key}" ]; then
            echo "NEMU_RELEASE_SIGNING_KEY is not set" >&2
            exit 1
          fi
          if [ -z "${BLOB_READ_WRITE_TOKEN:-}" ]; then
            echo "NEMU_RELEASE_CHANNELS_BLOB_TOKEN is not set" >&2
            exit 1
          fi
          git fetch origin --tags --force

          # Manifests carry the base64 Updater binaries, which are far larger
          # than one command-line argument may be. Pass large values to jq as
          # files, never with --arg or --argjson.
          work="$RUNNER_TEMP/publish"
          mkdir -p "$work"
          planner=./platform/updater/target/release/publish-release
          ./scripts/release-facts.sh "$RUNNER_TEMP/facts" > "$work/release.json"
          "$planner" decide < "$work/release.json" > "$work/decision.json"
          jq . "$work/decision.json"
          action=$(jq -r '.action' "$work/decision.json")

          echo 'null' > "$work/source.json"
          echo 'null' > "$work/build.json"
          if [ "$action" != "build" ]; then
            source_tag=$(jq -er '.sourceTag' "$work/decision.json")
            gh release download "$source_tag" --pattern release-manifest.json \
              --dir "$work/source" --clobber
            jq -e '.manifest' "$work/source/release-manifest.json" > "$work/source.json"
          else
            resolve() {
              local out digest
              out=$(docker buildx imagetools inspect "$1")
              digest=$(awk '/^Digest:/ { print $2; exit }' <<<"$out")
              if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "could not freeze a digest for $1" >&2
                exit 1
              fi
              printf '%s' "$digest"
            }
            mosquitto=$(resolve eclipse-mosquitto:2)
            zigbee=$(resolve koenkk/zigbee2mqtt)
            postgres=$(resolve postgres:16-alpine)
            base64 -w0 updater-bins/updater-amd64/updater > "$work/amd64.b64"
            base64 -w0 updater-bins/updater-arm64/updater > "$work/arm64.b64"
            jq -n \
              --arg mosquitto "$mosquitto" \
              --arg zigbee "$zigbee" \
              --arg matter "$MATTER_DIGEST" \
              --arg postgres "$postgres" \
              --arg core "$CORE_DIGEST" \
              --rawfile compose infra/prod/docker-compose.yml \
              --rawfile mosquittoConf infra/prod/mosquitto/mosquitto.conf \
              --rawfile amd64 "$work/amd64.b64" \
              --rawfile arm64 "$work/arm64.b64" \
              '{
                resolved: [
                  {service: "mosquitto", image: "eclipse-mosquitto:2", digest: $mosquitto},
                  {service: "zigbee2mqtt", image: "koenkk/zigbee2mqtt", digest: $zigbee},
                  {service: "nemu-matter", image: "ghcr.io/zed-softworks-official/nemu-matter", digest: $matter},
                  {service: "postgres", image: "postgres:16-alpine", digest: $postgres},
                  {service: "nemu-core", image: "ghcr.io/zed-softworks-official/nemu-core", digest: $core}
                ],
                stackFiles: [
                  {path: "docker-compose.yml", contents: $compose},
                  {path: "mosquitto/mosquitto.conf", contents: $mosquittoConf}
                ],
                migrations: [],
                updater: {amd64: $amd64, arm64: $arm64}
              }' > "$work/build.json"
          fi

          notes_since=$(jq -r '.notesSince // empty' "$work/decision.json")
          commit=$(jq -er '.commit' "$work/decision.json")
          ./scripts/release-notes.sh "$notes_since" "$commit" > "$work/notes.txt"
          # Updaters at 0.1.1 and older reject a manifest that has release
          # notes, so a Home on one would stop updating. Set the repository
          # variable NEMU_PUBLISH_RELEASE_NOTES to true only once every Home
          # runs a Release that understands them. The GitHub release always
          # has the notes.
          : > "$work/manifest-notes.txt"
          if [ "${PUBLISH_RELEASE_NOTES:-}" = "true" ]; then
            cp "$work/notes.txt" "$work/manifest-notes.txt"
          fi

          jq -n \
            --arg version "$EXPECTED_VERSION" \
            --arg commit "$EXPECTED_COMMIT" \
            --slurpfile release "$work/release.json" \
            --slurpfile build "$work/build.json" \
            --slurpfile source "$work/source.json" \
            --rawfile notes "$work/manifest-notes.txt" \
            '{
              release: $release[0],
              expectedVersion: $version,
              expectedCommit: $commit,
              build: $build[0],
              sourceManifest: $source[0],
              releaseNotes: $notes
            }' > "$work/request.json"
          NEMU_RELEASE_SIGNING_KEY="$signing_key" \
            "$planner" plan < "$work/request.json" > "$work/plan.json"
          unset signing_key

          jq -r '.signedManifest' "$work/plan.json" | base64 -d > "$RUNNER_TEMP/release-manifest.json"
          jq -e '.manifest.platformVersion' "$RUNNER_TEMP/release-manifest.json" >/dev/null
          version=$(jq -er '.platformVersion' "$work/plan.json")

          tag_images() {
            jq -c ".$1[]" "$work/plan.json" | while IFS= read -r row; do
              image=$(jq -r '.image' <<<"$row")
              tag=$(jq -r '.tag' <<<"$row")
              digest=$(jq -r '.digest' <<<"$row")
              docker buildx imagetools create -t "${image}:${tag}" "${image}@${digest}"
            done
          }

          # Nothing before this line writes a tag, a Release, or a channel.
          tag_images versionTags

          git_tag=$(jq -r '.gitTag // empty' "$work/plan.json")
          if [ -n "$git_tag" ]; then
            # An interrupted publish may have left a draft, possibly of another
            # commit. Without its tag it is not a Release. Listing releases
            # fails only on an error; having no draft is an empty list.
            drafts() {
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$work/releases.json"
              jq -r --arg tag "$git_tag" \
                '.[] | select(.draft and .tag_name == $tag) | "\(.id) \(.target_commitish)"' \
                "$work/releases.json"
            }
            drafts > "$work/drafts.txt"
            while read -r id _; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" < /dev/null
            done < "$work/drafts.txt"
            {
              echo "Platform version ${version}."
              if [ -s "$work/notes.txt" ]; then
                echo
                cat "$work/notes.txt"
              fi
            } > "$work/github-notes.md"
            kind=(--prerelease=false)
            latest=(--latest=true)
            if [ "$(jq -r '.prerelease' "$work/plan.json")" = "true" ]; then
              kind=(--prerelease=true)
              latest=(--latest=false)
            fi
            # Attach the manifest before the version tag exists. A draft
            # release does not publish the tag; publishing the release does.
            gh release create "$git_tag" \
              "$RUNNER_TEMP/release-manifest.json#release-manifest.json" \
              --draft \
              "${kind[@]}" \
              --target "$commit" \
              --title "$git_tag" \
              --notes-file "$work/github-notes.md"
            # Publish only a lone draft of this commit. The list may lag.
            for attempt in 1 2 3 4 5; do
              drafts > "$work/drafts.txt"
              if [ "$(wc -l < "$work/drafts.txt")" -eq 1 ] &&
                [ "$(cut -d ' ' -f 2 "$work/drafts.txt")" = "$commit" ]; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo "The draft of ${git_tag} does not target ${commit}:" >&2
                cat "$work/drafts.txt" >&2
                exit 1
              fi
              sleep 2
            done
            gh release edit "$git_tag" --draft=false "${kind[@]}" "${latest[@]}"
            for attempt in 1 2 3 4 5; do
              if git fetch --force origin "refs/tags/${git_tag}:refs/tags/${git_tag}"; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo "Publishing ${git_tag} did not create its tag" >&2
                exit 1
              fi
              sleep 2
            done
            existing=$(git rev-parse "refs/tags/${git_tag}^{commit}")
            if [ "$existing" != "$commit" ]; then
              echo "${git_tag} already points at another commit" >&2
              exit 1
            fi
          fi

          tag_images pointerTags

          # Channel manifests are mutable pointers, so they live on the install
          # host (get.nemu.sh/releases/<channel>.json), not on an immutable
          # GitHub release. Each v0.* release keeps its own manifest.
          # The request's query differs on every run, because a promotion has
          # its candidate's commit and the host caches by URL.
          channels=$(jq -r '.channels[]' "$work/plan.json")
          for channel in $channels; do
            url=$(node "$RUNNER_TEMP/channel-publisher/publish-channel-manifest.mjs" \
              "$channel" "$RUNNER_TEMP/release-manifest.json")
            echo "Published ${channel}.json to ${url}"
            curl -fsSL -H 'Cache-Control: no-cache' \
              "${url}?v=${version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              -o "$RUNNER_TEMP/published.json"
            cmp "$RUNNER_TEMP/release-manifest.json" "$RUNNER_TEMP/published.json"
          done

          # Only a hotfix syncs master back. Canary requires a pull request
          # (GitHub rejects listing the Actions app as a bypass actor on this
          # org), so open a PR instead of pushing the branch. A retry does not
          # reopen one that was merged or closed. Stable is already published,
          # and Actions may not be allowed to open pull requests, so a failure
          # here is a warning that says how to open it by hand.
          if [ "$(jq -r '.mergeBackToCanary' "$work/plan.json")" = "true" ]; then
            git fetch origin canary
            if ! git merge-base --is-ancestor "$commit" origin/canary; then
              branch="sync/stable-${version}-to-canary"
              sync_pr() {
                local existing
                existing=$(gh pr list --state all --base canary --head "$branch" --json number --jq 'length') || return 1
                if [ "$existing" != "0" ]; then
                  echo "Sync PR for ${branch} already exists."
                  return 0
                fi
                git push origin "${commit}:refs/heads/${branch}" || return 1
                gh pr create \
                  --base canary \
                  --head "$branch" \
                  --title "Sync Stable ${version} back to canary" \
                  --body "Hotfix Release ${version} was built on master. Merge this into canary so the next Release candidate has the fix."
              }
              if ! sync_pr; then
                compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/canary...${branch}?expand=1"
                echo "::warning title=Sync PR not opened::Hotfix Release ${version} is published, but its sync PR into canary was not opened. Open it at ${compare}"
                {
                  echo "### Open the sync PR by hand"
                  echo
                  echo "Hotfix Release ${version} is published, but its sync PR into \`canary\` was not opened."
                  echo "[Open it from \`${branch}\`](${compare}) and merge it."
                  echo
                  echo "If that branch does not exist, push it first:"
                  echo
                  echo "    git push origin ${commit}:refs/heads/${branch}"
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
