[package]
name = "nemu-matter"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
matter-codec = "0.3"
matter-controller = { version = "0.7", features = ["ble"] }
rumqttc = "0.25.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.12"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4.4"
