  - "@next/swc-linux-x64-musl@16.3.2 || 16.4.3"
  - "@next/swc-win32-arm64-msvc@16.3.2 || 16.4.3"
  - "@next/swc-win32-x64-msvc@16.3.2 || 16.4.3"
  - next@16.4.3
