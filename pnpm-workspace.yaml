packages:
  - "apps/*"
  - "platform/*"
  - "packages/*"
  - "tooling/*"

allowBuilds:
  bufferutil: true
  core-js: true
  esbuild: true
  sharp: true
  utf-8-validate: true

catalog:
  zod: ^4.3.6
  react: ^19.0.0
  react-dom: ^19.0.0
  "@types/react": ^19.0.10
  "@types/react-dom": ^19.0.10
  "@types/node": ^22.13.10
  typescript: ^5.9.2
  next: ^16.3.3
  "@clerk/nextjs": ^7.5.18
  "@clerk/ui": ^1.25.2
  convex: ^1.45.0
  axios: ^1.18.1

overrides:
  convex: "catalog:"
  utf-8-validate: 5.0.10

minimumReleaseAgeExclude:
  - convex@1.43.0
  - '@next/env@16.3.2'
  - '@next/swc-darwin-arm64@16.3.2'
  - '@next/swc-darwin-x64@16.3.2'
  - '@next/swc-linux-arm64-gnu@16.3.2'
  - '@next/swc-linux-arm64-musl@16.3.2'
  - '@next/swc-linux-x64-gnu@16.3.2'
  - '@next/swc-linux-x64-musl@16.3.2'
  - '@next/swc-win32-arm64-msvc@16.3.2'
  - '@next/swc-win32-x64-msvc@16.3.2'
  - next@16.3.2
