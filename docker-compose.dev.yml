services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto:/mosquitto/config:ro
    ports:
      - "1883:1883"

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt
    volumes:
      - ./infra/zigbee2mqtt:/app/data
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
    ports:
      - "8081:8080"
    depends_on:
      - mosquitto

  # Native Matter controller. Host network is required for mDNS/IPv6 and BlueZ.
  # Mosquitto is published on 127.0.0.1:1883 for this host-net client.
  nemu-matter:
    build:
      context: ./apps/matter
    network_mode: host
    environment:
      MQTT_HOST: 127.0.0.1
      MQTT_PORT: "1883"
      MQTT_BASE_TOPIC: matter
      MATTER_DATA_DIR: /data
      MATTER_PAA_DIR: /data/paa-roots
      MATTER_CD_DIR: /data/cd-roots
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
    security_opt:
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./infra/matter/controller:/data
      - /run/dbus:/run/dbus:ro
    depends_on:
      - mosquitto

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nemu
      POSTGRES_PASSWORD: nemu
      POSTGRES_DB: nemu
    ports:
      - "5432:5432"
    volumes:
      # Named volume so `compose down` (without -v) does not wipe members,
      # tokens, and devices. `compose down -v` still destroys it.
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
