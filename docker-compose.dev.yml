services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto:/mosquitto/config:ro
    ports:
      - "1883:1883"

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt
    volumes:
      - ./infra/zigbee2mqtt:/app/data
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
    ports:
      - "8081:8080"
    depends_on:
      - mosquitto

  # Matter controller. Host network is required for mDNS/IPv6; the WS API
  # stays on 127.0.0.1:5580. The image runs as uid 1000 — `pnpm infra` chowns
  # ./infra/matter before up. Run the MQTT adapter locally with
  # `pnpm --filter @nemu/matter-bridge dev` (it defaults to localhost URLs).
  matterjs-server:
    image: ghcr.io/matter-js/matterjs-server:1.4
    network_mode: host
    environment:
      LISTEN_ADDRESS: 127.0.0.1
      DISABLE_OTA: "true"
      NOBLE_BINDINGS: dbus
      BLUETOOTH_ADAPTER: "0"
      # Pin mDNS to the LAN NIC. Docker bridges steal multicast and
      # commissioning dies at "Reconnect / no address known".
      PRIMARY_INTERFACE: ${PRIMARY_INTERFACE:-}
    volumes:
      - ./infra/matter:/data
      - /run/dbus:/run/dbus:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nemu
      POSTGRES_PASSWORD: nemu
      POSTGRES_DB: nemu
    ports:
      - "5432:5432"
    volumes:
      # Named volume so `compose down` (without -v) does not wipe members,
      # tokens, and devices. `compose down -v` still destroys it.
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
