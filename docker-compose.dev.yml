services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto:/mosquitto/config:ro
    ports:
      - "1883:1883"

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt
    volumes:
      - ./infra/zigbee2mqtt:/app/data
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
    ports:
      - "8081:8080"
    depends_on:
      - mosquitto

  # The matter.js Matter adapter (ADR-0036). Host network is required for
  # mDNS/IPv6 and Bluetooth. Mosquitto is published on 127.0.0.1:1883 for this
  # host-net client.
  # Opt-in: `pnpm infra:full` (or `docker compose --profile matter up`).
  nemu-matter:
    profiles: [matter]
    build:
      # The repo root: the adapter uses the workspace package @nemu/protocol.
      context: .
      dockerfile: platform/matter-adapter/Dockerfile
    network_mode: host
    environment:
      MQTT_HOST: 127.0.0.1
      MQTT_PORT: "1883"
      MQTT_BASE_TOPIC: matter
      MATTER_DATA_DIR: /data
      MATTER_PAA_DIR: /data/paa-roots
      MATTER_CD_DIR: /data/cd-roots
      # TODO(NEM-113): matter.js drives Bluetooth over HCI, not BlueZ over
      # D-Bus. Drop DBUS_SYSTEM_BUS_ADDRESS and the /run/dbus mount once the
      # hardware spike confirms direct HCI in the container.
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
    security_opt:
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./infra/matter/controller:/data
      - /run/dbus:/run/dbus:ro
    depends_on:
      - mosquitto

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nemu
      POSTGRES_PASSWORD: nemu
      POSTGRES_DB: nemu
    ports:
      - "5432:5432"
    volumes:
      # Named volume so `compose down` (without -v) does not wipe members,
      # tokens, and devices. `compose down -v` still destroys it.
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
